version: '3.8'

services:
  grafana:
    image: grafana/grafana:latest
    container_name: siem-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-data:/var/lib/grafana
      - .:/home/data:ro  # Supaya Grafana bisa baca file siem.db di folder kita
    environment:
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource # Install plugin agar Grafana bisa baca SQLite
    restart: unless-stopped
